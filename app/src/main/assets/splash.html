<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>Lab Report</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#f1f5f9; }
  /* --u = screen ni nani bajuna 1% (portrait/landscape banne ma perfect fit) */
  :root { --u:min(1vw,1.2vh); }
  #splash { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#f1f5f9; transition:opacity .4s ease; }
  #splash.hide { opacity:0; }
  .box { display:flex; flex-direction:column; align-items:center; text-align:center; width:100%; padding:0 4vw; gap:calc(var(--u)*2); opacity:0; animation:fadeIn .9s ease .1s forwards; font-family:Georgia,'Times New Roman',serif; }
  .syr { width:calc(var(--u)*88); height:auto; transform:scaleX(-1); }
  .pct { font-family:'Segoe UI',Tahoma,sans-serif; font-size:calc(var(--u)*4.8); color:#475569; letter-spacing:.4px; margin-bottom:calc(var(--u)*1); }
  .pct b { color:#b91c1c; font-size:calc(var(--u)*5.4); }
  .tag { font-size:calc(var(--u)*5.4); font-style:italic; color:#64748b; letter-spacing:.3px; }
  .by { font-size:calc(var(--u)*6.4); font-weight:700; color:#0f172a; letter-spacing:.6px; }
  .by b { color:#b91c1c; }
  .line { width:calc(var(--u)*16); height:2px; background:linear-gradient(90deg,transparent,#b91c1c,transparent); margin:calc(var(--u)*.5) 0; }
  @keyframes fadeIn { to { opacity:1; } }
</style>
</head>
<body>
<div id="splash"><div class="box">
<svg class="syr" viewBox="0 0 270 56"><defs><clipPath id="synClip"><rect x="56" y="16" width="150" height="24" rx="2"/></clipPath></defs><line x1="4" y1="28" x2="42" y2="28" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/><rect x="42" y="22" width="14" height="12" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="1.2"/><rect x="56" y="14" width="150" height="28" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/><g clip-path="url(#synClip)"><rect id="synBlood" x="56" y="16" width="0" height="24" fill="#b91c1c"/><rect id="synShine" x="56" y="18" width="0" height="4" fill="#fff" opacity=".28"/></g><g stroke="#475569" stroke-width="1" opacity=".7"><line x1="86" y1="14" x2="86" y2="20"/><line x1="116" y1="14" x2="116" y2="20"/><line x1="146" y1="14" x2="146" y2="20"/><line x1="176" y1="14" x2="176" y2="20"/></g><rect x="206" y="10" width="5" height="36" rx="1.5" fill="#94a3b8" stroke="#475569" stroke-width="1"/><g id="synPlunger"><rect x="52" y="16" width="6" height="24" rx="1.5" fill="#334155"/><line x1="58" y1="28" x2="108" y2="28" stroke="#475569" stroke-width="4" stroke-linecap="round"/><rect x="108" y="12" width="6" height="32" rx="2" fill="#334155"/></g></svg>
<div class="pct">Collecting sample&hellip; <b id="creditPct">1</b><b>%</b></div>
<div class="tag">Every drop tells a story.</div>
<div class="line"></div>
<div class="by">Created by <b>Mahesh Vadher</b></div>
</div></div>
<script>
  var done = false;
  function go() {
    if (done) return; done = true;
    var s = document.getElementById('splash'); s.classList.add('hide');
    setTimeout(function () { location.replace('index.html'); }, 300);
  }
  document.getElementById('splash').addEventListener('click', go);
  (function () {
    var D = 2800, t0 = performance.now();
    var blood = document.getElementById('synBlood'), shine = document.getElementById('synShine'),
        plunger = document.getElementById('synPlunger'), pct = document.getElementById('creditPct');
    function step(now) {
      var p = Math.min(1, (now - t0) / D), e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;
      var w = 150 * e;
      if (blood) blood.setAttribute('width', w);
      if (shine) shine.setAttribute('width', Math.max(0, w - 4));
      if (plunger) plunger.setAttribute('transform', 'translate(' + w + ' 0)');
      if (pct) pct.textContent = Math.max(1, Math.round(p * 100));
      if (p < 1) requestAnimationFrame(step); else setTimeout(go, 450);
    }
    requestAnimationFrame(step);
  })();
</script>
</body>
</html>
